name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: truvity/ci-workflows/.github/actions/setup-devbox@b19968438f6f19b681517c4e2cfcb87fe7887673 # v2.16.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: devbox run -- just check
